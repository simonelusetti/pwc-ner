[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwc"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "transformers>=4.40",
    "datasets>=2.0",
    "tqdm",
    "prettytable",
    "accelerate>=0.27",
    "forge @ file:///home/simonelusetti/forge",
]

[tool.setuptools.packages.find]
include = ["zeshel*", "pipeline*"]

[tool.setuptools.package-data]
"*" = ["conf/**/*.yaml"]
