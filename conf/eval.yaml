# Pipeline comparison config
# Run with: forge -M eval --config-name eval run  (from project root)

forge:
  store: null
  tags: []
  verbose: true

data_dir: /home/simonelusetti/pwc/data/zeshel
dataset: zeshel             # zeshel | tackbp
splits: [test]
subset: null                # if set, cap mentions per split (e.g. 256 for smoke runs)
device: cpu

backends:
  biencoder:
    enabled: true
    checkpoint: /home/simonelusetti/pwc/models/biencoder_blink.pth  # run scripts/convert_blink.py
    model_name: bert-large-uncased
    batch_size: 8
    max_mention_len: 128
    max_entity_len: 128
    retrieval_k: 64

  crossencoder:
    enabled: true
    biencoder_checkpoint: /home/simonelusetti/pwc/models/biencoder_blink.pth
    checkpoint: /home/simonelusetti/pwc/models/crossencoder_blink.pth  # run scripts/convert_blink.py
    model_name: bert-large-uncased
    batch_size: 8
    max_mention_len: 128
    max_entity_len: 128
    max_cross_len: 256
    retrieval_k: 64

  autoregressive:
    enabled: true
    checkpoint: facebook/genre-linking-blink  # loaded directly from HuggingFace
    model_name: facebook/bart-large           # informational only; ignored when checkpoint is a HF ID
    batch_size: 8
    max_input_len: -1
    max_title_len: -1
    num_beams: 5
